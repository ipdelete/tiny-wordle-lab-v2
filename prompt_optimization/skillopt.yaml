model:
  backend: openai_compatible
  optimizer: gpt-oss-20b
  target: gpt-oss-20b
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  reasoning_effort: low

train:
  num_epochs: 1
  train_size: 8
  batch_size: 8
  accumulation: 1
  seed: 20260827

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 1
  failure_only: false

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: constant
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: soft
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

env:
  name: wordle
  skill_init: prompts/wordle-player/v1-baseline.md
  split_mode: split_dir
  split_dir: prompt_optimization/splits
  out_root: prompt_optimization/outputs/wordle-gpt-oss-20b
  rollout_repeats: 2
  api_base: http://127.0.0.1:4000/v1
  env_file: ~/src/wmd-router/.env
  target_model: gpt-oss-20b
  target_temperature: 0
  target_reasoning_effort: low
  target_max_tokens: 2048
  target_timeout_seconds: 180
