[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-wordle-lab"
version = "0.2.0"
description = "Hands-on LLM training course using Qwen3-0.6B and Wordle"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.13",
  "transformers>=4.51",
  "datasets>=3.0",
  "accelerate>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "jupyterlab>=4.2",
  "ipywidgets>=8.1",
  "tqdm>=4.66",
  "peft>=0.20.0",
  "openai>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
